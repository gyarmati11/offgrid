            - entity: number.fo_inverter_battery_grid_charging_current
              name: Hálózati töltőáram
            - entity: number.fo_inverter_battery_grid_charging_start
              name: Hálózati töltés indul (SOC)
            - type: divider
            - entity: number.fo_inverter_battery_absorption
              name: Abszorpció
            - entity: number.fo_inverter_battery_float
              name: Float
            - entity: number.fo_inverter_battery_equalization
              name: Kiegyenlítés
          - type: heading
            heading: Életciklus összesítők
            icon: mdi:counter
          - type: entities
            entities:
            - entity: sensor.deye_termeles_osszesen
              name: Termelés
            - entity: sensor.deye_fogyasztas_osszesen
              name: Fogyasztás
            - entity: sensor.deye_halozati_vetel_osszesen
              name: Hálózati vétel
            - entity: sensor.deye_akku_toltes_osszesen
              name: Akku töltés
            - entity: sensor.deye_akku_merites_osszesen
              name: Akku merítés
            - type: divider
            - entity: sensor.deye_megtakaritas_osszesen
              name: Megtakarítás összesen
            - entity: sensor.deye_halozati_koltseg_osszesen
              name: Hálózati költség összesen
          - type: markdown
            content: |
              {% set c = states('sensor.deye_akku_merites_osszesen') | float(0) %}
              {% set cap = states('input_number.deye_akku_kapacitas') | float(15) %}
              **Akku ciklusok (becslés):** {{ (c / cap) | round(0) | int }}
              **Akku hatásfok:** {{ (c / (states('sensor.deye_akku_toltes_osszesen') | float(1)) * 100) | round(1) }} %
        - type: vertical-stack
          cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#halozat'
            name: Hálózat
            icon: mdi:transmission-tower
            button_type: name
            show_header: true
          - type: heading
            heading: Hálózat (E.ON tartalék)
            icon: mdi:transmission-tower
          - type: grid
            columns: 2
            square: false
            cards:
            - type: tile
              entity: binary_sensor.fo_inverter_grid
              name: Hálózat jelen
            - type: tile
              entity: sensor.deye_halozat_teljesitmeny
              name: Teljesítmény
              color: red
            - type: tile
              entity: sensor.fo_inverter_grid_l1_voltage
              name: Feszültség
              color: red
            - type: tile
              entity: sensor.fo_inverter_grid_frequency
              name: Frekvencia
              color: red
            - type: tile
              entity: sensor.deye_vetel_napi
              name: Ma vásárolt
              icon: mdi:transmission-tower-import
              color: red
            - type: tile
              entity: sensor.deye_vetel_havi
              name: E havi vétel
              icon: mdi:transmission-tower-import
              color: red
            - type: tile
              entity: sensor.deye_koltseg_napi
              name: Mai költség
              icon: mdi:cash-minus
              color: orange
            - type: tile
              entity: sensor.deye_koltseg_havi
              name: E havi költség
              icon: mdi:cash-minus
              color: orange
          - type: statistics-graph
            title: Hálózati vétel – 30 nap (kWh)
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
            - change
            entities:
            - entity: sensor.deye_halozati_vetel_osszesen
              name: Vétel
          - type: custom:apexcharts-card
            graph_span: 7d
            header:
              show: true
              title: Hálózati teljesítmény és jelenlét – 7 nap
              show_states: false
            apex_config:
              chart:
                height: 200
              legend:
                position: bottom
            series:
            - entity: sensor.deye_halozat_teljesitmeny
              name: W
              type: area
              color: '#E5484D'
              opacity: 0.3
              group_by:
                func: avg
                duration: 15min
          - type: heading
            heading: Hálózat (E.ON / tartalék)
            icon: mdi:transmission-tower
          - type: entities
            state_color: true
            entities:
            - entity: binary_sensor.fo_inverter_grid
              name: Hálózat jelen
            - entity: sensor.fo_inverter_grid_power
              name: Teljesítmény
            - entity: sensor.fo_inverter_grid_l1_voltage
              name: Feszültség
            - entity: sensor.fo_inverter_grid_l1_current
              name: Áram
            - entity: sensor.fo_inverter_grid_frequency
              name: Frekvencia
            - type: divider
            - entity: switch.fo_inverter_off_grid
              name: Off-grid mód
            - entity: switch.fo_inverter_grid_peak_shaving
              name: Peak shaving
            - entity: number.fo_inverter_grid_peak_shaving
              name: Peak shaving határ
            - entity: number.fo_inverter_grid_voltage_protection_high
              name: Feszültségvédelem felső
            - entity: number.fo_inverter_grid_voltage_protection_low
              name: Feszültségvédelem alsó
            - entity: number.fo_inverter_grid_reconnection_time
              name: Visszakapcsolási idő

  # ===========================================================================
  #  2. SZERVIZ – professzionális, teljes oldalas nézet
  # ===========================================================================
  - title: Szerviz
    path: szerviz
    icon: mdi:tools
    theme: deye_sotet
    type: sections
    max_columns: 4
    sections:
      # ---------------------------------------------------------- RENDSZERÁLLAPOT
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Rendszerállapot
            icon: mdi:heart-pulse
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set inv = [('Fő inverter','fo_inverter'),('Inverter 2','inverter_2')] %}
              | | Állapot | Riasztás | Hiba | Akku riasztás | Hőm. | PV | Terhelés |
              |:--|:--:|:--:|:--:|:--:|--:|--:|--:|
              {% for n,i in inv -%}
              {% set ok = ['OK'] -%}
              | **{{ n }}** | {{ states('sensor.'~i~'_device_state') }} | {{ '✅' if states('sensor.'~i~'_device_alarm') in ok else '⚠️ '~states('sensor.'~i~'_device_alarm') }} | {{ '✅' if states('sensor.'~i~'_device_fault') in ok else '🚨 '~states('sensor.'~i~'_device_fault') }} | {{ '✅' if states('sensor.'~i~'_battery_alarm') in ok else '⚠️' }} | {{ states('sensor.'~i~'_temperature') }} °C | {{ states('sensor.'~i~'_pv_power') }} W | {{ states('sensor.'~i~'_load_power') }} W |
              {% endfor %}
          - type: tile
            entity: sensor.deye_pv_teljesitmeny
            name: PV össz
            color: amber
            grid_options: { columns: 3 }
          - type: tile
            entity: sensor.deye_fogyasztas_teljesitmeny
            name: Terhelés össz
            color: blue
            grid_options: { columns: 3 }
          - type: tile
            entity: sensor.deye_akku_teljesitmeny
            name: Akku (+merül/−tölt)
            color: green
            grid_options: { columns: 3 }
          - type: tile
            entity: sensor.deye_halozat_teljesitmeny
            name: Hálózat
            color: red
            grid_options: { columns: 3 }

      # ---------------------------------------------------------- ENERGIAFOLYAM
      - type: grid
        cards:
          - type: heading
            heading: Energiafolyam (klasszikus)
            icon: mdi:transit-connection-variant
          - type: custom:sunsynk-power-flow-card
            grid_options: { columns: full }
            cardstyle: full
            large_font: true
            show_solar: true
            show_battery: true
            show_grid: true
            decimal_places: 1
            inverter:
              model: deye
              modern: true
              autarky: energy
              three_phase: false
            battery:
              energy: 15360
              shutdown_soc: 5
              show_daily: true
            solar:
              mppts: 3
              show_daily: true
              max_power: 8900
              pv1_name: Ház tető
              pv2_name: Garázs DK
              pv3_name: Garázs DNY
            load:
              show_daily: true
            grid:
              show_daily_buy: true
              show_daily_sell: false
            entities:
              inverter_status_59: sensor.fo_inverter_device_state
              day_battery_charge_70: sensor.deye_akku_toltes_napi
              day_battery_discharge_71: sensor.deye_akku_merites_napi
              day_load_energy_84: sensor.deye_fogyasztas_napi
              day_grid_import_76: sensor.deye_vetel_napi
              day_pv_energy_108: sensor.deye_termeles_napi
              inverter_power_175: sensor.deye_fogyasztas_teljesitmeny
              essential_power: sensor.deye_fogyasztas_teljesitmeny
              grid_connected_status_194: binary_sensor.fo_inverter_grid
              grid_ct_power_172: sensor.deye_halozat_teljesitmeny
              battery_voltage_183: sensor.fo_inverter_battery_voltage
              battery_soc_184: sensor.deye_akku_soc
              battery_power_190: sensor.deye_akku_teljesitmeny
              battery_current_191: sensor.deye_akku_aram
              battery_temp_182: sensor.fo_inverter_battery_temperature
              radiator_temp_91: sensor.fo_inverter_temperature
              pv1_power_186: sensor.deye_string_1
              pv2_power_187: sensor.deye_string_2
              pv3_power_188: sensor.deye_string_3
              pv_total: sensor.deye_pv_teljesitmeny
              remaining_solar: sensor.deye_elorejelzes_ma_hatralevo

      # ---------------------------------------------------------- FŐ INVERTER
      - type: grid
        cards:
          - type: heading
            heading: Fő inverter
            icon: mdi:alpha-m-box
          - type: entities
            state_color: true
            entities:
              - { entity: sensor.fo_inverter_device_state, name: Állapot }
              - { entity: sensor.fo_inverter_pv1_power, name: PV1 teljesítmény }
              - { entity: sensor.fo_inverter_pv1_voltage, name: PV1 feszültség }
              - { entity: sensor.fo_inverter_pv1_current, name: PV1 áram }
              - { entity: sensor.fo_inverter_pv2_power, name: PV2 teljesítmény }
              - { entity: sensor.fo_inverter_pv2_voltage, name: PV2 feszültség }
              - { entity: sensor.fo_inverter_pv2_current, name: PV2 áram }
              - type: divider
              - { entity: sensor.fo_inverter_load_power, name: Terhelés }
              - { entity: sensor.fo_inverter_battery_power, name: Akku teljesítmény }
              - { entity: sensor.fo_inverter_battery_current, name: Akku áram }
              - { entity: sensor.fo_inverter_grid_power, name: Hálózat }
              - { entity: sensor.fo_inverter_temperature, name: Hőmérséklet }
              - { entity: sensor.fo_inverter_dc_temperature, name: DC hőmérséklet }
              - type: divider
              - { entity: sensor.fo_inverter_today_production, name: Mai termelés }
              - { entity: sensor.fo_inverter_today_load_consumption, name: Mai fogyasztás }

      # ---------------------------------------------------------- INVERTER 2
      - type: grid
        cards:
          - type: heading
            heading: Inverter 2
            icon: mdi:alpha-s-box
          - type: entities
            state_color: true
            entities:
              - { entity: sensor.inverter_2_device_state, name: Állapot }
              - { entity: sensor.inverter_2_pv1_power, name: PV1 teljesítmény }
              - { entity: sensor.inverter_2_pv1_voltage, name: PV1 feszültség }
              - { entity: sensor.inverter_2_pv1_current, name: PV1 áram }
              - { entity: sensor.inverter_2_pv2_power, name: PV2 teljesítmény }
              - { entity: sensor.inverter_2_pv2_voltage, name: PV2 feszültség }
              - { entity: sensor.inverter_2_pv2_current, name: PV2 áram }
              - type: divider
              - { entity: sensor.inverter_2_load_power, name: Terhelés }
              - { entity: sensor.inverter_2_battery_power, name: Akku teljesítmény }
              - { entity: sensor.inverter_2_battery_current, name: Akku áram }
              - { entity: sensor.inverter_2_grid_power, name: Hálózat }
              - { entity: sensor.inverter_2_temperature, name: Hőmérséklet }
              - { entity: sensor.inverter_2_dc_temperature, name: DC hőmérséklet }
              - type: divider
              - { entity: sensor.inverter_2_today_production, name: Mai termelés }
              - { entity: sensor.inverter_2_today_load_consumption, name: Mai fogyasztás }

      # ---------------------------------------------------------- AKKUMULÁTOR
      - type: grid
        cards:
          - type: heading
            heading: Akkumulátor (15 kWh)
            icon: mdi:battery-high
          - type: gauge
            entity: sensor.deye_akku_soc
            name: Töltöttség
            needle: true
            severity: { green: 50, yellow: 20, red: 0 }
          - type: entities
            state_color: true
            entities:
              - { entity: sensor.deye_akku_soc, name: SOC, secondary_info: last-changed }
              - { entity: sensor.deye_akku_hasznos_energia, name: Hasznos energia (tartalék felett) }
              - { entity: sensor.deye_akku_hatralevo_ido, name: Hátralévő idő }
              - { entity: sensor.fo_inverter_battery_voltage, name: Feszültség }
              - { entity: sensor.deye_akku_aram, name: Áram (össz) }
              - { entity: sensor.deye_akku_teljesitmeny, name: Teljesítmény (össz) }
              - { entity: sensor.fo_inverter_battery_temperature, name: Hőmérséklet }
              - { entity: sensor.fo_inverter_battery_state, name: Állapot }
              - { entity: sensor.fo_inverter_battery_capacity, name: BMS kapacitás }
              - { entity: sensor.fo_inverter_battery_alarm, name: Riasztás }
              - { entity: sensor.fo_inverter_battery_fault, name: Hiba }
              - type: divider
              - { entity: sensor.deye_akku_toltes_osszesen, name: Össz. töltés }
              - { entity: sensor.deye_akku_merites_osszesen, name: Össz. merítés }

      # ---------------------------------------------------------- AKKU BEÁLLÍTÁSOK
      - type: grid
        cards:
          - type: heading
            heading: Akku beállítások (Fő inverter)
            icon: mdi:battery-sync
          - type: entities
            entities:
              - { entity: number.fo_inverter_battery_max_charging_current, name: Max töltőáram }
              - { entity: number.fo_inverter_battery_max_discharging_current, name: Max merítőáram }
              - { entity: number.fo_inverter_battery_shutdown_soc, name: Lekapcsolási SOC }
              - { entity: number.fo_inverter_battery_restart_soc, name: Újraindítási SOC }
              - { entity: number.fo_inverter_battery_low_soc, name: Alacsony SOC }
              - type: divider
              - { entity: switch.fo_inverter_battery_grid_charging, name: Hálózati töltés }
              - { entity: number.fo_inverter_battery_grid_charging_current, name: Hálózati töltőáram }
              - { entity: number.fo_inverter_battery_grid_charging_start, name: Hálózati töltés indul (SOC) }
              - type: divider
              - { entity: number.fo_inverter_battery_absorption, name: Abszorpció }
              - { entity: number.fo_inverter_battery_float, name: Float }
              - { entity: number.fo_inverter_battery_equalization, name: Kiegyenlítés }

      # ---------------------------------------------------------- SZTRINGEK
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Napelem sztringek
            icon: mdi:solar-panel-large
          - type: markdown
            grid_options: { columns: full }
            content: |
              | Sztring | Most | Kihaszn. | Arány | Napszög | Várthoz | Ma | Holnap |
              |:--|--:|--:|--:|--:|--:|--:|--:|
              {% for s in expand('group.deye_napelem_sztringek') -%}
              {% set id = s.entity_id -%}
              {% set k = id ~ '_kihasznaltsag' %}{% set a = id ~ '_napszog' -%}
              {% set vt = state_attr(k, 'vartbol') -%}
              | **{{ s.attributes.felirat }}**<br><small>{{ s.attributes.dolesszog }}° / {{ s.attributes.azimut }}° · {{ (s.attributes.csucs_w | float(0) / 1000) | round(1) }} kWp</small> | {{ s.state | int(0) }} W | {{ states(k) | int(0) }} % | {{ state_attr(k, 'arany_osszesbol') | int(0) }} % | {{ '∠ ' ~ states(a) | int(0) ~ '°' if states(a) | int(0) > 0 else '—' }} | {{ (vt | string ~ ' %') if vt is not none else '—' }} | {{ s.attributes.elorejelzes_ma }} kWh | {{ s.attributes.elorejelzes_holnap }} kWh |
              {% endfor %}
              | **Összesen** | **{{ states('sensor.deye_pv_teljesitmeny') }} W** | {{ (states('sensor.deye_pv_teljesitmeny') | float(0) / (state_attr('sensor.deye_pv_teljesitmeny','csucs_w') | float(1)) * 100) | round(0) | int }} % | 100 % | | | **{{ states('sensor.deye_elorejelzes_ma') }} kWh** | **{{ states('sensor.deye_elorejelzes_holnap') }} kWh** |

              <small>**Kihasználtság** = a tömb névleges teljesítményéhez képest · **Arány** = az összes napelem-termelésből · **Napszög** = a napsugár és a panel felülete közti szög (90° = merőleges, ideális) · **Várthoz** = a Forecast.Solar most várt értékéhez képest (tartósan alacsony → árnyék, kosz vagy hiba)</small>
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: true, title: Sztringek – 48 óra, show_states: true, colorize_states: true }
            graph_span: 48h
            apex_config:
              chart: { height: 260 }
              stroke: { curve: smooth }
              legend: { position: bottom }
            series:
              - { entity: sensor.deye_string_1, name: Ház tető, color: "#F59E0B", type: area, opacity: 0.25, group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_2, name: Garázs DK, color: "#10B981", type: line, group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_3, name: Garázs DNY, color: "#8B5CF6", type: line, group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_elorejelzes_most, name: Előrejelzés (össz), color: "#9CA3AF", type: line, stroke_dash: 4, group_by: { func: avg, duration: 10min } }
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: true, title: Napbeesési szög ma (90° = merőleges), show_states: true, colorize_states: true }
            graph_span: 24h
            span: { start: day }
            now: { show: true }
            yaxis: [ { min: 0, max: 90, decimals: 0 } ]
            apex_config: { chart: { height: 220 }, stroke: { curve: smooth }, legend: { position: bottom } }
            series:
              - { entity: sensor.deye_string_1_napszog, name: Ház tető, color: "#F59E0B", group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_2_napszog, name: Garázs DK, color: "#10B981", group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_3_napszog, name: Műhely Ny, color: "#8B5CF6", group_by: { func: avg, duration: 10min } }
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: true, title: Kihasználtság ma (% a névlegeshez), show_states: true, colorize_states: true }
            graph_span: 24h
            span: { start: day }
            now: { show: true }
            yaxis: [ { min: 0, max: 100, decimals: 0 } ]
            apex_config: { chart: { height: 220 }, stroke: { curve: smooth }, legend: { position: bottom } }
            series:
              - { entity: sensor.deye_string_1_kihasznaltsag, name: Ház tető, color: "#F59E0B", type: area, opacity: 0.2, group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_2_kihasznaltsag, name: Garázs DK, color: "#10B981", group_by: { func: avg, duration: 10min } }
              - { entity: sensor.deye_string_3_kihasznaltsag, name: Műhely Ny, color: "#8B5CF6", group_by: { func: avg, duration: 10min } }

      # ---------------------------------------------------------- HŐMÉRSÉKLETEK
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hőmérsékletek
            icon: mdi:thermometer
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: true, title: Inverter és akku – 48 óra, show_states: true, colorize_states: true }
            graph_span: 48h
            apex_config:
              chart: { height: 260 }
              stroke: { curve: smooth }
              legend: { position: bottom }
              annotations:
                yaxis:
                  - { y: 55, borderColor: "#EF4444", label: { text: Hűtés BE 55°C } }
                  - { y: 45, borderColor: "#3B82F6", label: { text: Hűtés KI 45°C } }
            series:
              - { entity: sensor.fo_inverter_temperature, name: Fő inverter, color: "#EF4444", group_by: { func: avg, duration: 10min } }
              - { entity: sensor.inverter_2_temperature, name: Inverter 2, color: "#F97316", group_by: { func: avg, duration: 10min } }
              - { entity: sensor.fo_inverter_battery_temperature, name: Akku, color: "#22C55E", group_by: { func: avg, duration: 10min } }

      # ---------------------------------------------------------- TELJESÍTMÉNY 7 NAP
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Teljesítmény – 7 nap
            icon: mdi:chart-areaspline
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: false }
            graph_span: 7d
            apex_config:
              chart: { height: 300 }
              stroke: { curve: smooth }
              legend: { position: bottom }
            yaxis:
              - { id: w, decimals: 0 }
              - { id: soc, opposite: true, min: 0, max: 100, decimals: 0 }
            series:
              - { entity: sensor.deye_pv_teljesitmeny, name: PV, yaxis_id: w, color: "#F5A623", type: area, opacity: 0.3, group_by: { func: avg, duration: 15min } }
              - { entity: sensor.deye_fogyasztas_teljesitmeny, name: Terhelés, yaxis_id: w, color: "#3B82F6", group_by: { func: avg, duration: 15min } }
              - { entity: sensor.deye_halozat_teljesitmeny, name: Hálózat, yaxis_id: w, color: "#EF4444", group_by: { func: avg, duration: 15min } }
              - { entity: sensor.deye_akku_soc, name: Akku %, yaxis_id: soc, color: "#22C55E", group_by: { func: last, duration: 15min } }

      # ---------------------------------------------------------- HÁLÓZAT
      - type: grid
        cards:
          - type: heading
            heading: Hálózat (E.ON / tartalék)
            icon: mdi:transmission-tower
          - type: entities
            state_color: true
            entities:
              - { entity: binary_sensor.fo_inverter_grid, name: Hálózat jelen }
              - { entity: sensor.fo_inverter_grid_power, name: Teljesítmény }
              - { entity: sensor.fo_inverter_grid_l1_voltage, name: Feszültség }
              - { entity: sensor.fo_inverter_grid_l1_current, name: Áram }
              - { entity: sensor.fo_inverter_grid_frequency, name: Frekvencia }
              - type: divider
              - { entity: switch.fo_inverter_off_grid, name: Off-grid mód }
              - { entity: switch.fo_inverter_grid_peak_shaving, name: Peak shaving }
              - { entity: number.fo_inverter_grid_peak_shaving, name: Peak shaving határ }
              - { entity: number.fo_inverter_grid_voltage_protection_high, name: Feszültségvédelem felső }
              - { entity: number.fo_inverter_grid_voltage_protection_low, name: Feszültségvédelem alsó }
              - { entity: number.fo_inverter_grid_reconnection_time, name: Visszakapcsolási idő }

      # ---------------------------------------------------------- MUNKAMÓD
      - type: grid
        cards:
          - type: heading
            heading: Munkamód
            icon: mdi:cog-transfer
          - type: entities
            entities:
              - { entity: select.fo_inverter_work_mode, name: Work mode }
              - { entity: select.fo_inverter_energy_pattern, name: Energy pattern }
              - { entity: number.fo_inverter_zero_export_power, name: Zero export teljesítmény }
              - { entity: select.fo_inverter_time_of_use, name: Time of Use }
              - { entity: select.fo_inverter_io_mode, name: IO mód }
              - { entity: switch.fo_inverter_smartload, name: SmartLoad }
              - { entity: number.fo_inverter_smartload_on, name: SmartLoad BE (SOC) }
              - { entity: number.fo_inverter_smartload_off, name: SmartLoad KI (SOC) }

      # ---------------------------------------------------------- TIME OF USE PROGRAMOK
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Time of Use programok
            icon: mdi:clock-time-four-outline
          - type: markdown
            grid_options: { columns: full }
            content: |
              | # | Kezdés | Töltés | Teljesítmény | SOC | Feszültség |
              |:--:|:--:|:--|--:|--:|--:|
              {% for i in range(1,7) -%}
              {% set b = 'fo_inverter_program_' ~ i -%}
              | {{ i }} | {{ states('time.'~b~'_time')[:5] }} | {{ states('select.'~b~'_charging') }} | {{ states('number.'~b~'_power') }} W | {{ states('number.'~b~'_soc') }} % | {{ states('number.'~b~'_voltage') }} V |
              {% endfor %}
          - type: entities
            title: Szerkesztés
            grid_options: { columns: full }
            entities:
              - type: section
                label: Program 1
              - time.fo_inverter_program_1_time
              - select.fo_inverter_program_1_charging
              - number.fo_inverter_program_1_power
              - number.fo_inverter_program_1_soc
              - type: section
                label: Program 2
              - time.fo_inverter_program_2_time
              - select.fo_inverter_program_2_charging
              - number.fo_inverter_program_2_power
              - number.fo_inverter_program_2_soc
              - type: section
                label: Program 3
              - time.fo_inverter_program_3_time
              - select.fo_inverter_program_3_charging
              - number.fo_inverter_program_3_power
              - number.fo_inverter_program_3_soc
              - type: section
                label: Program 4
              - time.fo_inverter_program_4_time
              - select.fo_inverter_program_4_charging
              - number.fo_inverter_program_4_power
              - number.fo_inverter_program_4_soc
              - type: section
                label: Program 5
              - time.fo_inverter_program_5_time
              - select.fo_inverter_program_5_charging
              - number.fo_inverter_program_5_power
              - number.fo_inverter_program_5_soc
              - type: section
                label: Program 6
              - time.fo_inverter_program_6_time
              - select.fo_inverter_program_6_charging
              - number.fo_inverter_program_6_power
              - number.fo_inverter_program_6_soc

      # ---------------------------------------------------------- ÉLETCIKLUS
      - type: grid
        cards:
          - type: heading
            heading: Életciklus összesítők
            icon: mdi:counter
          - type: entities
            entities:
              - { entity: sensor.deye_termeles_osszesen, name: Termelés }
              - { entity: sensor.deye_fogyasztas_osszesen, name: Fogyasztás }
              - { entity: sensor.deye_halozati_vetel_osszesen, name: Hálózati vétel }
              - { entity: sensor.deye_akku_toltes_osszesen, name: Akku töltés }
              - { entity: sensor.deye_akku_merites_osszesen, name: Akku merítés }
              - type: divider
              - { entity: sensor.deye_megtakaritas_osszesen, name: Megtakarítás összesen }
              - { entity: sensor.deye_halozati_koltseg_osszesen, name: Hálózati költség összesen }
          - type: markdown
            content: |
              {% set c = states('sensor.deye_akku_merites_osszesen') | float(0) %}
              {% set cap = states('input_number.deye_akku_kapacitas') | float(15) %}
              **Akku ciklusok (becslés):** {{ (c / cap) | round(0) | int }}
              **Akku hatásfok:** {{ (c / (states('sensor.deye_akku_toltes_osszesen') | float(1)) * 100) | round(1) }} %

      # ---------------------------------------------------------- DIAGNOSZTIKA
      - type: grid
        cards:
          - type: heading
            heading: Diagnosztika
            icon: mdi:stethoscope
          - type: entities
            state_color: true
            entities:
              - { entity: binary_sensor.fo_inverter_connection, name: Fő inverter kapcsolat }
              - { entity: sensor.fo_inverter_update_interval, name: Fő inv. frissítés }
              - { entity: binary_sensor.inverter_2_connection, name: Inverter 2 kapcsolat }
              - { entity: sensor.inverter_2_update_interval, name: Inv. 2 frissítés }
              - { entity: switch.fo_inverter_access_point, name: Access point }
              - { entity: select.fo_inverter_cloud, name: Cloud }
          - type: button
            name: Fő inverter újraindítása
            icon: mdi:restart-alert
            show_state: false
            grid_options: { columns: 6, rows: 2 }
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.fo_inverter_restart }
              confirmation: { text: "Biztosan újraindítod a FŐ invertert? Rövid kimaradás lehet!" }
          - type: button
            name: Inverter 2 újraindítása
            icon: mdi:restart-alert
            show_state: false
            grid_options: { columns: 6, rows: 2 }
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.inverter_2_restart }
              confirmation: { text: "Biztosan újraindítod az Inverter 2-t?" }

      # ---------------------------------------------------------- RENDSZER BEÁLLÍTÁSOK
      - type: grid
        cards:
          - type: heading
            heading: Dashboard beállítások
            icon: mdi:tune
          - type: entities
            entities:
              - input_boolean.deye_ertesitesek
              - input_datetime.deye_reggeli_ertesites
              - input_datetime.deye_esti_ertesites
              - type: divider
              - input_number.deye_aramar_megtakaritas
              - input_number.deye_aramar_vetel
              - type: divider
              - input_number.deye_akku_kapacitas
              - input_number.deye_akku_tartalek_soc
              - input_number.deye_ajanlas_kuszob
              - input_number.deye_ejszakai_arany
          - type: entities
            title: Elemzés
            entities:
              - { entity: sensor.deye_fogyasztasi_ajanlas, name: Ajánlás }
              - { entity: sensor.deye_mai_energiamerleg, name: Mai mérleg }
              - { entity: sensor.deye_holnapi_energiamerleg, name: Holnapi mérleg }
              - { entity: sensor.deye_varhato_napi_fogyasztas, name: Várható napi fogyasztás }
              - { entity: sensor.deye_atlagfogyasztas_7_nap, name: 7 napos átlag }
              - { entity: binary_sensor.deye_napenergia_tobblet, name: Napenergia-többlet }
