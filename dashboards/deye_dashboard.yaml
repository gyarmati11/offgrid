# =============================================================================
#  DEYE OFF-GRID DASHBOARD – "Otthon" (hétköznapi) + "Szerviz" (professzionális)
#  Beillesztés: Beállítások → Irányítópultok → Új → "Kezdés üresen" →
#               ⋮ → Szerkesztés → ⋮ → Nyers konfigurációs szerkesztő → ide másold
#  Szükséges HACS elemek:  deye-haz-card (saját), bubble-card, apexcharts-card,
#                          sunsynk-power-flow-card (csak a Szerviz nézetben)
# =============================================================================
title: Napenergia
views:
  # ===========================================================================
  #  1. OTTHON – egyszerű, hétköznapi nézet
  # ===========================================================================
  - title: Otthon
    path: otthon
    icon: mdi:home-lightning-bolt
    theme: deye_sotet
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------- MOST
      - type: grid
        cards:
          - type: heading
            heading: Most
            icon: mdi:flash
          - type: custom:deye-haz-card
            # Minden beállítás alapértelmezett (a saját telekhez igazítva).
            # Felülírható pl.: strings, positions, tap, entities, night – lásd a kártya README-jét.
            grid_options: { columns: full }
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set e = 'sensor.deye_fogyasztasi_ajanlas' %}
              <ha-alert alert-type="{{ state_attr(e,'tipus') or 'info' }}" title="{{ state_attr(e,'cim') }}">
              {{ state_attr(e,'uzenet') }}
              </ha-alert>
          - type: tile
            entity: sensor.deye_pv_teljesitmeny
            name: Napelem
            icon: mdi:solar-power-variant
            color: amber
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_fogyasztas_teljesitmeny
            name: Ház fogyasztás
            color: blue
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_akku_soc
            name: Akku
            state_content: [state, allapot]
            color: green
            grid_options: { columns: full }
          - type: tile
            entity: sensor.deye_halozat_teljesitmeny
            name: Hálózat
            color: red
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_elorejelzes_ma_hatralevo
            name: Ma még jön
            icon: mdi:weather-sunset-down
            color: orange
            grid_options: { columns: 6 }

      # ---------------------------------------------------------- MA
      - type: grid
        cards:
          - type: heading
            heading: Ma
            icon: mdi:calendar-today
          - type: tile
            entity: sensor.deye_termeles_napi
            name: Termelés
            icon: mdi:solar-power
            color: amber
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_fogyasztas_napi
            name: Fogyasztás
            icon: mdi:home-lightning-bolt-outline
            color: blue
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_vetel_napi
            name: Hálózatból
            icon: mdi:transmission-tower-import
            color: red
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.deye_megtakaritas_napi
            name: Megtakarítás
            icon: mdi:piggy-bank
            color: green
            grid_options: { columns: 6 }
          - type: gauge
            entity: sensor.deye_onellatas_napi
            name: Önellátás ma
            min: 0
            max: 100
            needle: true
            severity: { green: 80, yellow: 50, red: 0 }
            grid_options: { columns: full }
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: true, title: Mai teljesítmény, show_states: false }
            graph_span: 24h
            span: { start: day }
            now: { show: true, label: Most, color: "#888" }
            apex_config:
              chart: { height: 260 }
              legend: { show: true, position: bottom }
              stroke: { curve: smooth }
            yaxis:
              - id: w
                min: 0
                decimals: 0
                apex_config: { title: { text: W } }
              - id: soc
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config: { title: { text: "%" } }
            series:
              - entity: sensor.deye_pv_teljesitmeny
                name: Napelem
                yaxis_id: w
                type: area
                color: "#F5A623"
                opacity: 0.35
                stroke_width: 2
                group_by: { func: avg, duration: 5min }
              - entity: sensor.deye_fogyasztas_teljesitmeny
                name: Fogyasztás
                yaxis_id: w
                type: line
                color: "#3B82F6"
                stroke_width: 2
                group_by: { func: avg, duration: 5min }
              - entity: sensor.deye_akku_soc
                name: Akku %
                yaxis_id: soc
                type: line
                color: "#22C55E"
                stroke_width: 2
                group_by: { func: last, duration: 5min }

      # ---------------------------------------------------------- ELŐREJELZÉS
      - type: grid
        cards:
          - type: heading
            heading: Előrejelzés – 5 nap
            icon: mdi:weather-partly-cloudy
          - type: custom:apexcharts-card
            grid_options: { columns: full }
            header: { show: false }
            graph_span: 5d
            span: { start: day }
            apex_config:
              chart: { height: 230 }
              legend: { show: true, position: bottom }
              plotOptions: { bar: { borderRadius: 6, columnWidth: "55%" } }
              dataLabels: { enabled: true, enabledOnSeries: [0] }
              xaxis: { labels: { format: ddd } }
            yaxis:
              - min: 0
                decimals: 0
                apex_config: { title: { text: kWh } }
            series:
              - entity: sensor.deye_elorejelzes_napok
                name: Várható termelés
                type: column
                color: "#F5A623"
                data_generator: |
                  return (entity.attributes.napok || []).map(n =>
                    [new Date(n.datum + 'T12:00:00').getTime(), n.kwh]);
              - entity: sensor.deye_varhato_napi_fogyasztas
                name: Várható fogyasztás
                type: line
                color: "#3B82F6"
                stroke_width: 3
                data_generator: |
                  const v = parseFloat(entity.state) || 0;
                  const t = new Date(); t.setHours(12,0,0,0);
                  return [0,1,2,3,4].map(i => [t.getTime() + i*86400000, v]);
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set avg = states('sensor.deye_varhato_napi_fogyasztas') | float(10) %}
              | Nap | | Várható | Mérleg |
              |:--|:--:|--:|--:|
              {% for n in state_attr('sensor.deye_elorejelzes_napok','napok') or [] -%}
              {% set m = (n.kwh - avg) | round(1) -%}
              | **{{ n.nap }}** <small>{{ n.datum[5:] | replace('-','.') }}{{ ' *' if n.forras == 'becslés' }}</small> | {{ n.emoji }} | {{ n.kwh }} kWh | {{ '🟢 +' ~ m if m >= 0 else '🔴 ' ~ m }} |
              {% endfor %}

              <small>Átlagos napi fogyasztás: {{ avg }} kWh · * = időjárás alapú becslés</small>
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            grid_options: { columns: full }

      # ---------------------------------------------------------- STATISZTIKA
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Statisztika
            icon: mdi:chart-bar
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set p = [('Ma','napi'),('Hét','heti'),('Hónap','havi'),('Év','eves')] %}
              {% macro n(e, d=1) %}{{ '{:,.{}f}'.format(states(e) | float(0), d) | replace(',', ' ') }}{% endmacro %}
              | | Ma | Hét | Hónap | Év |
              |:--|--:|--:|--:|--:|
              | ☀️ Termelés (kWh) | {% for c,k in p %}{{ n('sensor.deye_termeles_'~k) }} | {% endfor %}
              | 🏠 Fogyasztás (kWh) | {% for c,k in p %}{{ n('sensor.deye_fogyasztas_'~k) }} | {% endfor %}
              | ⚡ Hálózatból (kWh) | {% for c,k in p %}{{ n('sensor.deye_vetel_'~k) }} | {% endfor %}
              | 🛡️ Önellátás | {% for c,k in p %}**{{ n('sensor.deye_onellatas_'~k, 0) }} %** | {% endfor %}
              | 💰 Megtakarítás (Ft) | {% for c,k in p %}**{{ n('sensor.deye_megtakaritas_'~k, 0) }}** | {% endfor %}
              | 🧾 Hálózati költség (Ft) | {% for c,k in p %}{{ n('sensor.deye_koltseg_'~k, 0) }} | {% endfor %}
          - type: tile
            entity: input_select.deye_idoszak
            name: Grafikon időszak
            hide_state: true
            grid_options: { columns: full }
            features:
              - type: select-options

          # --- MA (óránként)
          - type: conditional
            grid_options: { columns: full }
            conditions: [{ condition: state, entity: input_select.deye_idoszak, state: Ma }]
            card:
              type: vertical-stack
              cards:
                - type: statistics-graph
                  title: Energia ma – óránként (kWh)
                  chart_type: bar
                  period: hour
                  days_to_show: 1
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_termeles_osszesen, name: Termelés }
                    - { entity: sensor.deye_fogyasztas_osszesen, name: Fogyasztás }
                    - { entity: sensor.deye_halozati_vetel_osszesen, name: Hálózat }
                - type: statistics-graph
                  title: Forint ma – óránként
                  chart_type: bar
                  period: hour
                  days_to_show: 1
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_megtakaritas_osszesen, name: Megtakarítás }
                    - { entity: sensor.deye_halozati_koltseg_osszesen, name: Hálózati költség }

          # --- HÉT (naponta)
          - type: conditional
            grid_options: { columns: full }
            conditions: [{ condition: state, entity: input_select.deye_idoszak, state: Hét }]
            card:
              type: vertical-stack
              cards:
                - type: statistics-graph
                  title: Energia – utolsó 7 nap (kWh)
                  chart_type: bar
                  period: day
                  days_to_show: 7
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_termeles_osszesen, name: Termelés }
                    - { entity: sensor.deye_fogyasztas_osszesen, name: Fogyasztás }
                    - { entity: sensor.deye_halozati_vetel_osszesen, name: Hálózat }
                - type: statistics-graph
                  title: Forint – utolsó 7 nap
                  chart_type: bar
                  period: day
                  days_to_show: 7
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_megtakaritas_osszesen, name: Megtakarítás }
                    - { entity: sensor.deye_halozati_koltseg_osszesen, name: Hálózati költség }
                - type: statistics-graph
                  title: Önellátás – utolsó 7 nap (%)
                  chart_type: line
                  period: day
                  days_to_show: 7
                  stat_types: [mean]
                  entities:
                    - { entity: sensor.deye_onellatas_napi_zaro, name: Önellátás }

          # --- HÓNAP (naponta)
          - type: conditional
            grid_options: { columns: full }
            conditions: [{ condition: state, entity: input_select.deye_idoszak, state: Hónap }]
            card:
              type: vertical-stack
              cards:
                - type: statistics-graph
                  title: Energia – utolsó 30 nap (kWh)
                  chart_type: bar
                  period: day
                  days_to_show: 30
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_termeles_osszesen, name: Termelés }
                    - { entity: sensor.deye_fogyasztas_osszesen, name: Fogyasztás }
                    - { entity: sensor.deye_halozati_vetel_osszesen, name: Hálózat }
                - type: statistics-graph
                  title: Forint – utolsó 30 nap
                  chart_type: bar
                  period: day
                  days_to_show: 30
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_megtakaritas_osszesen, name: Megtakarítás }
                    - { entity: sensor.deye_halozati_koltseg_osszesen, name: Hálózati költség }
                - type: statistics-graph
                  title: Önellátás – utolsó 30 nap (%)
                  chart_type: line
                  period: day
                  days_to_show: 30
                  stat_types: [mean]
                  entities:
                    - { entity: sensor.deye_onellatas_napi_zaro, name: Önellátás }

          # --- ÉV (havonta)
          - type: conditional
            grid_options: { columns: full }
            conditions: [{ condition: state, entity: input_select.deye_idoszak, state: Év }]
            card:
              type: vertical-stack
              cards:
                - type: statistics-graph
                  title: Energia – havonta, 12 hónap (kWh)
                  chart_type: bar
                  period: month
                  days_to_show: 365
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_termeles_osszesen, name: Termelés }
                    - { entity: sensor.deye_fogyasztas_osszesen, name: Fogyasztás }
                    - { entity: sensor.deye_halozati_vetel_osszesen, name: Hálózat }
                - type: statistics-graph
                  title: Forint – havonta, 12 hónap
                  chart_type: bar
                  period: month
                  days_to_show: 365
                  stat_types: [change]
                  entities:
                    - { entity: sensor.deye_megtakaritas_osszesen, name: Megtakarítás }
                    - { entity: sensor.deye_halozati_koltseg_osszesen, name: Hálózati költség }
                - type: statistics-graph
                  title: Önellátás – havi átlag (%)
                  chart_type: bar
                  period: month
                  days_to_show: 365
                  stat_types: [mean]
                  entities:
                    - { entity: sensor.deye_onellatas_napi_zaro, name: Önellátás }

      # ---------------------------------------------------------- RÉSZLETEK: Bubble Card pop-upok
      - type: grid
        column_span: 3
        cards:
        - type: heading
          heading: Részletek (felugró panelek – a ház kártyáról nyílnak)
          heading_style: subtitle
          icon: mdi:gesture-tap
        - type: vertical-stack
          cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#napelemek'
            name: Napelemek
            icon: mdi:solar-panel
            button_type: name
            show_header: true
          - type: heading
            heading: Napelemek most
            icon: mdi:solar-power-variant
          - type: grid
            columns: 2
            square: false
            cards:
            - type: tile
              entity: sensor.deye_pv_teljesitmeny
              name: Összes PV
              color: amber
            - type: tile
              entity: sensor.deye_termeles_napi
              name: Mai termelés
              icon: mdi:solar-power
              color: amber
            - type: tile
              entity: sensor.deye_elorejelzes_ma_hatralevo
              name: Ma még várható
              icon: mdi:weather-sunset-down
              color: orange
            - type: tile
              entity: sensor.deye_elorejelzes_holnap
              name: Holnap várható
              icon: mdi:weather-sunny-alert
              color: orange
          - type: heading
            heading: Ház tető (4,9 kWp · 45° / D)
            icon: mdi:solar-panel-large
          - type: tile
            entity: sensor.deye_string_1
            name: Teljesítmény
            color: amber
          - type: grid
            columns: 2
            square: false
            cards:
            - type: gauge
              entity: sensor.deye_string_1_kihasznaltsag
              name: Kihasználtság (névlegeshez)
              min: 0
              max: 100
              needle: true
              severity:
                green: 50
                yellow: 20
                red: 0
            - type: gauge
              entity: sensor.deye_string_1_napszog
              name: Napszög (90° = ideális)
              min: 0
              max: 90
              needle: true
              severity:
                green: 60
                yellow: 30
                red: 0
          - type: entities
            entities:
            - type: attribute
              entity: sensor.deye_string_1_kihasznaltsag
              attribute: arany_osszesbol
              name: Arány az összes termelésből
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_1_kihasznaltsag
              attribute: vartbol
              name: Most várthoz képest (Forecast.Solar)
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_1_napszog
              attribute: beesesi_szog
              name: Beesési szög (a normálishoz)
              suffix: °
            - type: attribute
              entity: sensor.deye_string_1
              attribute: elorejelzes_ma
              name: Előrejelzés ma
              suffix: kWh
            - type: attribute
              entity: sensor.deye_string_1
              attribute: elorejelzes_holnap
              name: Előrejelzés holnap
              suffix: kWh
            - entity: sensor.fo_inverter_pv2_voltage
              name: MPPT feszültség
            - entity: sensor.fo_inverter_pv2_current
              name: MPPT áram
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: 'Ma: teljesítmény és napszög'
              show_states: false
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
              legend:
                position: bottom
            yaxis:
            - id: w
              min: 0
              decimals: 0
            - id: deg
              opposite: true
              min: 0
              max: 90
              decimals: 0
            series:
            - entity: sensor.deye_string_1
              name: W
              yaxis_id: w
              type: area
              color: '#F59E0B'
              opacity: 0.3
              group_by:
                func: avg
                duration: 10min
            - entity: sensor.deye_string_1_napszog
              name: Napszög
              yaxis_id: deg
              color: '#94A3B8'
              stroke_width: 2
              group_by:
                func: avg
                duration: 10min
          - type: heading
            heading: Garázs DK (70° / DK)
            icon: mdi:solar-panel-large
          - type: tile
            entity: sensor.deye_string_2
            name: Teljesítmény
            color: amber
          - type: grid
            columns: 2
            square: false
            cards:
            - type: gauge
              entity: sensor.deye_string_2_kihasznaltsag
              name: Kihasználtság (névlegeshez)
              min: 0
              max: 100
              needle: true
              severity:
                green: 50
                yellow: 20
                red: 0
            - type: gauge
              entity: sensor.deye_string_2_napszog
              name: Napszög (90° = ideális)
              min: 0
              max: 90
              needle: true
              severity:
                green: 60
                yellow: 30
                red: 0
          - type: entities
            entities:
            - type: attribute
              entity: sensor.deye_string_2_kihasznaltsag
              attribute: arany_osszesbol
              name: Arány az összes termelésből
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_2_kihasznaltsag
              attribute: vartbol
              name: Most várthoz képest (Forecast.Solar)
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_2_napszog
              attribute: beesesi_szog
              name: Beesési szög (a normálishoz)
              suffix: °
            - type: attribute
              entity: sensor.deye_string_2
              attribute: elorejelzes_ma
              name: Előrejelzés ma
              suffix: kWh
            - type: attribute
              entity: sensor.deye_string_2
              attribute: elorejelzes_holnap
              name: Előrejelzés holnap
              suffix: kWh
            - entity: sensor.inverter_2_pv1_voltage
              name: MPPT feszültség
            - entity: sensor.inverter_2_pv1_current
              name: MPPT áram
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: 'Ma: teljesítmény és napszög'
              show_states: false
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
              legend:
                position: bottom
            yaxis:
            - id: w
              min: 0
              decimals: 0
            - id: deg
              opposite: true
              min: 0
              max: 90
              decimals: 0
            series:
            - entity: sensor.deye_string_2
              name: W
              yaxis_id: w
              type: area
              color: '#10B981'
              opacity: 0.3
              group_by:
                func: avg
                duration: 10min
            - entity: sensor.deye_string_2_napszog
              name: Napszög
              yaxis_id: deg
              color: '#94A3B8'
              stroke_width: 2
              group_by:
                func: avg
                duration: 10min
          - type: heading
            heading: Műhely nyugat (70° / Ny)
            icon: mdi:solar-panel-large
          - type: tile
            entity: sensor.deye_string_3
            name: Teljesítmény
            color: amber
          - type: grid
            columns: 2
            square: false
            cards:
            - type: gauge
              entity: sensor.deye_string_3_kihasznaltsag
              name: Kihasználtság (névlegeshez)
              min: 0
              max: 100
              needle: true
              severity:
                green: 50
                yellow: 20
                red: 0
            - type: gauge
              entity: sensor.deye_string_3_napszog
              name: Napszög (90° = ideális)
              min: 0
              max: 90
              needle: true
              severity:
                green: 60
                yellow: 30
                red: 0
          - type: entities
            entities:
            - type: attribute
              entity: sensor.deye_string_3_kihasznaltsag
              attribute: arany_osszesbol
              name: Arány az összes termelésből
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_3_kihasznaltsag
              attribute: vartbol
              name: Most várthoz képest (Forecast.Solar)
              suffix: '%'
            - type: attribute
              entity: sensor.deye_string_3_napszog
              attribute: beesesi_szog
              name: Beesési szög (a normálishoz)
              suffix: °
            - type: attribute
              entity: sensor.deye_string_3
              attribute: elorejelzes_ma
              name: Előrejelzés ma
              suffix: kWh
            - type: attribute
              entity: sensor.deye_string_3
              attribute: elorejelzes_holnap
              name: Előrejelzés holnap
              suffix: kWh
            - entity: sensor.inverter_2_pv2_voltage
              name: MPPT feszültség
            - entity: sensor.inverter_2_pv2_current
              name: MPPT áram
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            header:
              show: true
              title: 'Ma: teljesítmény és napszög'
              show_states: false
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
              legend:
                position: bottom
            yaxis:
            - id: w
              min: 0
              decimals: 0
            - id: deg
              opposite: true
              min: 0
              max: 90
              decimals: 0
            series:
            - entity: sensor.deye_string_3
              name: W
              yaxis_id: w
              type: area
              color: '#8B5CF6'
              opacity: 0.3
              group_by:
                func: avg
                duration: 10min
            - entity: sensor.deye_string_3_napszog
              name: Napszög
              yaxis_id: deg
